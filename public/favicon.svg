<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- "T" letterform with a subtle track/progress feel -->
  <text x="256" y="360" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="320" fill="url(#check)">T</text>
  <!-- Small progress arc accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 256 36 A 220 220 0 0 1 476 256" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="24" stroke-linecap="round"/>
</svg>